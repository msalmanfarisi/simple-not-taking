<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cute notebook favicon. Original artwork by the project author.
  Released under CC0 1.0 Universal (Public Domain). Free for commercial use.
  https://creativecommons.org/publicdomain/zero/1.0/
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Notebook">
  <defs>
    <linearGradient id="cover" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f5b78e"/>
      <stop offset="1" stop-color="#d97f6c"/>
    </linearGradient>
    <linearGradient id="page" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#f4ecdc"/>
    </linearGradient>
  </defs>

  <!-- Notebook body -->
  <rect x="8" y="8" width="44" height="48" rx="6" fill="url(#cover)"/>
  <rect x="14" y="8" width="38" height="48" rx="3" fill="url(#page)"/>

  <!-- Spiral binding -->
  <g fill="#caa17a">
    <circle cx="11" cy="14" r="2"/>
    <circle cx="11" cy="22" r="2"/>
    <circle cx="11" cy="30" r="2"/>
    <circle cx="11" cy="38" r="2"/>
    <circle cx="11" cy="46" r="2"/>
    <circle cx="11" cy="54" r="2"/>
  </g>

  <!-- Lines -->
  <g stroke="#e7d6b9" stroke-width="1.5" stroke-linecap="round">
    <line x1="20" y1="34" x2="46" y2="34"/>
    <line x1="20" y1="40" x2="42" y2="40"/>
    <line x1="20" y1="46" x2="44" y2="46"/>
  </g>

  <!-- Cute face -->
  <g fill="#3a2a22">
    <circle cx="24" cy="22" r="2"/>
    <circle cx="36" cy="22" r="2"/>
  </g>
  <path d="M26 27 Q30 30 34 27" stroke="#3a2a22" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="20" cy="25" r="1.6" fill="#ffb3a1" opacity="0.7"/>
  <circle cx="40" cy="25" r="1.6" fill="#ffb3a1" opacity="0.7"/>

  <!-- Bookmark ribbon -->
  <path d="M44 8 L44 18 L48 14 L52 18 L52 8 Z" fill="#5b8c7d"/>
</svg>
